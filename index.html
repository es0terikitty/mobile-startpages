<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>home</title>
    <link rel="icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0714">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            var themes = [
                { id: 'blink', img: 'gif-blink.gif', theme: 'blink', color: '#0a0714' },
                { id: 'head', img: 'head.jpg', theme: 'head', color: '#0d1a11' }
            ];
            var pick = themes[Math.floor(Math.random() * themes.length)];
            document.documentElement.setAttribute('data-theme', pick.theme);
            document.querySelector('meta[name="theme-color"]').setAttribute('content', pick.color);
            window.__artSrc = pick.img;
        })();
    </script>
</head>

<body>
    <div class="container">
        <div class="art">
            <img src="gif-blink.gif" alt="blink gif" id="art" />
        </div>

        <div class="time">
            <p id="clock">--:--</p>
            <p id="date">---</p>
        </div>

        <div class="shortcuts">
            <a class="shortcut" href="https://x.com"><i class="ico">&#xf099;</i><span>x.com</span></a>
            <a class="shortcut" href="https://es0terikitty.github.io"><i class="ico">&#xf0e7;</i><span>es0terikitty</span></a>
            <a class="shortcut" href="https://miruro.to"><i class="ico">&#xf144;</i><span>miruro.to</span></a>
            <a class="shortcut" href="https://everythingmoe.com"><i class="ico">&#xf02d;</i><span>everythingmoe.com</span></a>
        </div>

        <form class="search" id="search-form">
            <i class="ico search-icon">&#xf002;</i>
            <input type="text" id="search-input" placeholder="search" autocomplete="off" autofocus />
        </form>
    </div>

    <script>
        const bangs = {
            '@dd': 'https://duckduckgo.com/?q=',
            '@ss': 'https://www.startpage.com/sp/search?query=',
            '@yt': 'https://www.youtube.com/results?search_query=',
            '@rd': 'https://www.reddit.com/search/?q='
        };

        const input = document.getElementById('search-input');

        if (window.__artSrc) {
            document.getElementById('art').src = window.__artSrc;
        }

        document.getElementById('search-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const query = input.value.trim();
            if (!query) return;

            let url = 'https://www.google.com/search?q=' + encodeURIComponent(query);
            for (const [bang, base] of Object.entries(bangs)) {
                if (query === bang) {
                    url = base;
                    break;
                }
                if (query.startsWith(bang + ' ')) {
                    const rest = query.slice(bang.length).trim();
                    url = base + encodeURIComponent(rest);
                    break;
                }
            }

            input.value = '';
            window.location.href = url;
        });

        const clockEl = document.getElementById('clock');
        const dateEl = document.getElementById('date');
        const days = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
        const months = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
        function tick() {
            const d = new Date();
            const p = n => String(n).padStart(2, '0');
            clockEl.textContent = p(d.getHours()) + ':' + p(d.getMinutes());
            dateEl.textContent = days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
        }
        tick();
        setInterval(tick, 10000);
    </script>
</body>

</html>
